allowBuilds:
  esbuild: true
  sharp: true

# Transitive advisories pulled in by @lhci/cli (dev-only; never shipped).
# Dependabot cannot resolve patched versions inside that tree, so it fails its
# update run on every schedule. Pin to the lowest non-vulnerable releases
# instead: uuid >= 11.1.1 is outside every affected range and stays
# CommonJS-capable, and tmp >= 0.2.4 fixes the path-traversal advisory.
overrides:
  uuid: ^11.1.1
  tmp: ^0.2.4

# Two extract-zip advisories remain open and cannot be overridden:
# GHSA-7pqw-9j4j-h8q3 and GHSA-jmr9-qjv8-65gv. The advisory covers <= 2.0.1 and
# 2.0.1 is the newest release, so no patched version exists. Left open by
# decision on 2026-09-16 rather than dismissed.
